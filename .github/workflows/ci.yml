name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      # Integration tests run against a real PostgreSQL instance: the booking
      # conflict guarantees are database constraints, so mocking would test
      # nothing that matters.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bmd
          POSTGRES_PASSWORD: bmd_ci_password
          POSTGRES_DB: bmd_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bmd -d bmd_studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://bmd:bmd_ci_password@localhost:5432/bmd_studio_test?schema=public
      DATABASE_URL: postgresql://bmd:bmd_ci_password@localhost:5432/bmd_studio_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@bmd/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the job on a high or critical advisory in production dependencies.
      - run: npm audit --omit=dev --audit-level=high
